# daizhang.bianzige.cn — 掌兴代账系统（正式版：80 跳 443 + SSL + SPA 回退）
# 部署位置：/www/server/panel/vhost/nginx/daizhang.bianzige.cn.conf
server {
    listen 80;
    listen [::]:80;
    server_name daizhang.bianzige.cn;

    # ACME HTTP 验证（证书自动续期用，必须保留在 80 端口）
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/daizhang.bianzige.cn/app/dist;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/daizhang.bianzige.cn.log;
    error_log /www/wwwlogs/daizhang.bianzige.cn.error.log;
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name daizhang.bianzige.cn;
    index index.html;
    root /www/wwwroot/daizhang.bianzige.cn/app/dist;

    ssl_certificate     /www/server/panel/vhost/cert/daizhang.bianzige.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/daizhang.bianzige.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 带 hash 的构建产物长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    access_log /www/wwwlogs/daizhang.bianzige.cn.log;
    error_log /www/wwwlogs/daizhang.bianzige.cn.error.log;
}
